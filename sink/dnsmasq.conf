# dnsmasq inside the sbxsink namespace (run by sbx-dnsmasq.service), DHCP
# only: guests get an address with the sink as gateway and DNS server.
# DNS itself is answered by sink.py (wildcard A records, empty AAAA, per-name
# overrides from rules.json); dnsmasq cannot return an empty AAAA for a
# wildcard without an upstream, and musl fails a lookup whose AAAA is REFUSED.
port=0
interface=eth0
bind-interfaces
except-interface=lo
log-dhcp
dhcp-range=10.200.0.100,10.200.0.199,255.255.255.0,1h
dhcp-option=option:router,10.200.0.1
dhcp-option=option:dns-server,10.200.0.1
dhcp-authoritative
dhcp-leasefile=/run/sbx-dnsmasq/leases
pid-file=/run/sbx-dnsmasq/dnsmasq.pid
user=sbxsink
group=sbxsink
